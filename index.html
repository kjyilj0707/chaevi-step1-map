<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fffdf8">
<title>충전소 지도 (STEP 1-2 예비)</title>
<script>
/* 컴퓨터처럼 넓은 화면에서 직접 열면 휴대폰 비율 틀(frame.html) 안에서 보여 줌 */
if (window.top === window.self && matchMedia('(min-width: 821px)').matches) location.replace('frame.html' + location.hash);
</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="충전소 지도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --navy:#1b4965; --navy2:#143a52; --mint:#58ddd0; --mint2:#17a99a; --mintbg:#f8f0e2;
  --surface:#fffdf8; --ink:#2b2622; --ink2:#6b625a; --muted:#9a9087;
  --grid:#efe8dc; --axis:#d6ccbe; --accent:#ff7a59; --me:#2a78d6;
  --q1:#d3f6f1; --q2:#8ee6dc; --q3:#3fcabd; --q4:#1f8f8f; --q5:#1b4965; --nodata:#b9bfc4;
  --s1:#1b4965; --s3:#17a99a; --shadow:0 4px 16px rgba(74,52,28,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f4ede2;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}

/* 시작 화면 */
#intro{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#fff;color:var(--navy);transition:opacity .35s}
#intro.hide{opacity:0;pointer-events:none}
.intro-in{max-width:520px;width:100%;text-align:center}
#intro h1{font-size:34px;line-height:1.25;margin:0 0 28px;font-weight:800;letter-spacing:-.01em}
#start{appearance:none;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:14px 34px;border-radius:99px}
#start:hover{background:var(--navy2)}

/* 본 화면: 지도가 전체, 그 위에 떠 있는 조작부 */
#map{position:fixed;inset:0;background:#f1e9dc;outline:none}
.top{position:fixed;z-index:1000;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;max-width:520px;pointer-events:none}
.top > *{pointer-events:auto}
.search{display:flex;align-items:center;gap:10px;height:52px;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:0 8px 0 14px}
.search .logo{width:28px;height:28px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search button{flex:none;border:0;background:var(--mintbg);color:var(--navy);font-size:12px;font-weight:600;border-radius:99px;padding:8px 12px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid transparent;background:var(--surface);box-shadow:0 2px 8px rgba(74,52,28,.16);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.hourpill{position:fixed;z-index:1000;left:12px;top:calc(132px + env(safe-area-inset-top));width:58px;background:var(--surface);border-radius:29px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.hourpill button{border:0;background:transparent;width:44px;height:34px;font-size:15px;color:var(--navy);border-radius:17px}
.hourpill button:active{background:var(--mintbg)}
.hourpill b{font-size:19px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.hourpill span{font-size:10px;color:var(--ink2)}
.hourpill hr{width:26px;border:0;border-top:3px solid var(--mint);border-radius:2px;margin:3px 0}
.fabs{position:fixed;z-index:1000;right:12px;top:calc(132px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--navy);display:flex;align-items:center;justify-content:center}
.fab[aria-pressed="true"]{background:var(--navy);color:#fff}
.fab svg{width:24px;height:24px}
#locate{position:fixed;z-index:1000;right:12px;bottom:calc(var(--sheet-h, 190px) + 14px);color:var(--me)}
.legendbox{position:fixed;z-index:1000;right:72px;top:calc(132px + env(safe-area-inset-top));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;color:var(--ink2);display:none}
.legendbox.on{display:block}
.legendbox b{display:block;color:var(--navy);margin-bottom:4px;font-size:12px}
.legendbox div{display:flex;align-items:center;gap:6px;line-height:1.7}
.legendbox i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(23,48,63,.55);display:inline-block}
.legendbox i.stay{background:#fff;border:3px solid var(--accent)}
.legendbox i.me{background:var(--me);border:2px solid #fff;box-shadow:0 0 0 1px var(--me)}

/* 아래 서랍 */
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(74,52,28,.20);
  height:var(--sheet-h,190px);max-height:calc(100vh - 150px);display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom)}
#locate,.maplibregl-ctrl-bottom-left{transition:bottom .32s cubic-bezier(.2,.85,.25,1)}
body.dragging .sheet,body.dragging #locate,body.dragging .maplibregl-ctrl-bottom-left{transition:none}
body.dragging #map{pointer-events:none}
.handle,.tabs{touch-action:none;user-select:none;-webkit-user-select:none}
.handle{flex:none;border:0;background:transparent;width:100%;height:28px;cursor:grab;display:flex;align-items:center;justify-content:center}
.handle::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--axis)}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f3ebdf;border-radius:14px;padding:4px;margin:0 12px 8px}
.tabs button{border:0;background:transparent;border-radius:11px;padding:9px 0;font-size:14px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(20,58,82,.15)}
.body{flex:1;overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.sort{display:flex;gap:6px;margin:0 0 8px}
.sort button{border:1px solid var(--axis);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2)}
.sort button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:11px;color:var(--ink2);margin:0 2px 6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--grid);cursor:pointer}
.row:hover{background:var(--mintbg)}
.row .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(23,48,63,.55);flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11px;color:var(--ink2)}
.row .oc{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .oc b{display:block;font-size:14px;color:var(--navy)}
.row .oc span{font-size:11px;color:var(--ink2)}
.badge{font-size:10px;color:#fff;background:var(--accent);border-radius:99px;padding:1px 7px;font-weight:600;vertical-align:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.act{border:0;background:var(--navy);color:#fff;border-radius:99px;padding:10px 16px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block}
.act.ghost{background:var(--mintbg);color:var(--navy)}
.next{background:var(--mintbg);border-radius:10px;padding:8px 10px;color:var(--ink) !important;font-size:14px !important}
.next b{color:var(--navy);margin-right:6px}
.infrabar,#infraChips,.listbtn{display:none}
body.infra .search,body.infra #chips{display:none}
body.infra .infrabar{display:flex}
body.infra #infraChips{display:flex}
.infrabar{align-items:center;gap:6px;height:52px;background:var(--navy);color:#fff;border-radius:26px;box-shadow:var(--shadow);padding:0 6px}
.infrabar button{flex:none;width:40px;height:40px;border:0;background:transparent;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.infrabar button:active{background:rgba(255,255,255,.15)}
.infrabar div{flex:1;min-width:0;line-height:1.2}
.infrabar b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infrabar span{font-size:11px;color:#b9cfda}
.chip .ic{display:flex;align-items:center}
.chip b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.chip[aria-pressed="true"] b{color:#cfe0e8}
body.infra .listbtn{display:flex}
.listbtn{position:fixed;z-index:1090;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,190px) + 14px);border:0;background:var(--navy);color:#fff;border-radius:99px;
  padding:10px 18px;font-size:14px;font-weight:700;align-items:center;gap:7px;box-shadow:var(--shadow);transition:bottom .32s cubic-bezier(.2,.85,.25,1)}
body.dragging .listbtn{transition:none}
body.nav .listbtn{display:none}
.placecard{display:none;position:fixed;z-index:1095;left:12px;right:12px;max-width:520px;bottom:calc(var(--sheet-h,190px) + 12px);align-items:center;gap:10px;
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 8px 10px 12px;transition:bottom .32s cubic-bezier(.2,.85,.25,1)}
body.dragging .placecard{transition:none}
body.infra.placeon .placecard{display:flex}
body.infra.placeon .listbtn{display:none}
.placecard .pin{width:36px;height:36px;border-radius:50%;flex:none;color:#fff;display:flex;align-items:center;justify-content:center}
.pcmid{flex:1;min-width:0}
.pcmid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcmid span{font-size:12px;color:var(--ink2)}
.pcgo{flex:none;border:0;background:var(--navy);color:#fff;border-radius:99px;padding:10px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pcx{flex:none;width:34px;height:34px;border:0;background:transparent;color:var(--ink2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--grid);cursor:pointer}
.prow:hover{background:var(--mintbg)}
.prow .pin,.placepop .pin{width:30px;height:30px;border-radius:50%;flex:none;color:#fff;display:flex;align-items:center;justify-content:center}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{font-size:11px;color:var(--ink2)}
.prow .oc b{font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums}
.placepop .maplibregl-popup-content{display:flex;align-items:center;gap:9px;border-radius:12px;padding:6px 11px;box-shadow:var(--shadow);background:var(--surface);font:inherit}
.placepop .pin{width:28px;height:28px}
.placepop b{display:block;font-size:14px;color:var(--ink)}
.placepop span{font-size:11px;color:var(--ink2)}
.placepop .maplibregl-popup-tip{border-top-color:var(--surface);border-bottom-color:var(--surface)}
@media (min-width:821px){ .listbtn{display:none !important} }
.back{border:0;background:var(--mintbg);color:var(--navy);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;margin-bottom:8px}
h3{margin:0;font-size:17px;color:var(--navy)}
.det p{margin:2px 0;font-size:12px;color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.facts div{font-size:11px;color:var(--ink2);background:var(--mintbg);border-radius:10px;padding:7px 8px}
.facts b{display:block;font-size:15px;color:var(--navy)}
h4{font-size:13px;margin:14px 0 6px;color:var(--navy)}
.lg{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin-bottom:4px}
.lg i{display:inline-block;height:2px;width:14px;vertical-align:3px;margin-right:4px}
svg.chart{display:block;width:100%;max-width:520px;height:auto;overflow:visible}
svg.chart text{fill:var(--muted);font-size:10px}
.limits{font-size:11px;color:var(--ink2);padding-left:16px;margin:6px 0}
/* 경로 안내 화면 */
.navtop,.navfabs,.recenter,.navdetail,.navcard{display:none}
body.nav .top,body.nav .hourpill,body.nav #legendBtn,body.nav #allBtn,body.nav .legendbox,body.nav .sheet,body.nav #locate{display:none}
body.nav .fabs{top:calc(112px + env(safe-area-inset-top))}
body.nav .navtop{display:flex}
.navtop{position:fixed;z-index:1200;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;max-width:520px;flex-direction:column;
  background:var(--navy);color:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.navmain{display:flex;align-items:center;gap:12px;min-height:78px;padding:12px 18px}
.navnote{display:flex;align-items:center;gap:12px;background:var(--navy2);padding:0 16px;max-height:0;opacity:0;transition:max-height .35s ease, opacity .35s ease, padding .35s ease}
.navnote.on{max-height:80px;opacity:1;padding:12px 16px}
.navnote .noteic{width:40px;height:40px;border-radius:11px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.navnote .noteic svg{width:26px;height:26px}
.navnote b{display:block;font-size:17px !important;font-weight:700;line-height:1.3 !important}
.navnote span{font-size:15px;color:#cfe0e8}
/* 도보 안내: 흰 동그라미 안 화살표 + 그 아래 거리, 오른쪽에 방향 */
body.walk .navmain{display:grid;grid-template-columns:76px 1fr;column-gap:14px;row-gap:4px;align-items:center;padding:16px 20px 14px}
body.walk .navarrow{grid-column:1;grid-row:1;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--navy);align-items:center;justify-content:center;justify-self:center}
body.walk .navarrow svg{width:36px;height:36px}
body.walk #navDist{grid-column:1;grid-row:2;font-size:17px;font-weight:700;text-align:center}
body.walk #navText{grid-column:2;grid-row:1;font-size:26px !important;font-weight:700}
body.walk .fabs{top:calc(176px + env(safe-area-inset-top))}
body.nav.walk .navfabs,body.nav.walk .navcard{display:none}
.walkfab,.walkcard{display:none}
body.walk .walkfab{display:flex;position:fixed;z-index:1000;bottom:calc(124px + env(safe-area-inset-bottom))}
#walkOverview{left:12px} #walkRe{right:12px}
body.walk .walkcard{display:block}
.walkcard{position:fixed;z-index:1200;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(74,52,28,.20);padding:8px 14px calc(18px + env(safe-area-inset-bottom)) 18px}
.wgrip{display:block;width:44px;height:5px;border-radius:3px;background:var(--axis);margin:0 auto 10px}
.wrow{display:flex;align-items:center;gap:10px}
.wmain{flex:1;min-width:0}
.wline{display:flex;align-items:baseline;gap:10px;color:var(--navy);white-space:nowrap}
.wline b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.wline b small{font-size:16px;font-weight:700}
.wline i{width:1px;height:14px;background:var(--axis);align-self:center}
.wline span{font-size:16px;font-weight:600;color:var(--mint2)}
.wbar{position:relative;height:6px;border-radius:3px;background:var(--grid);margin:14px 6px 4px 10px}
.wfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--navy);width:0;transition:width .4s}
.wdot{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:3px solid var(--navy);color:var(--navy);display:flex;align-items:center;justify-content:center;transition:left .4s}
#walkMenu{flex:none;width:48px;height:48px;border:0;background:transparent;color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
body.walk .recenter{bottom:calc(124px + env(safe-area-inset-bottom))}
body.walk .navdetail{bottom:calc(112px + env(safe-area-inset-bottom))}
body.walk .maplibregl-ctrl-bottom-left{display:none}
.navarrow{width:46px;height:46px;flex:none;color:var(--mint);display:flex}
.navarrow svg{width:100%;height:100%}
.navtop b{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.navtop span#navText{font-size:24px;font-weight:600;line-height:1.15;min-width:0}
body.nav .navfabs{display:flex}
.navfabs{position:fixed;z-index:1000;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));flex-direction:column;gap:10px}
.navfabs .fab{font-size:13px}
.navfabs #zin,.navfabs #zout{font-size:24px;font-weight:400}
.recenter{position:fixed;z-index:1100;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));border:0;background:var(--navy);color:#fff;
  border-radius:99px;padding:12px 20px;font-size:16px;font-weight:700;align-items:center;gap:8px;box-shadow:var(--shadow)}
body.nav .recenter.on{display:flex}
body.nav .navcard{display:flex}
.navcard{position:fixed;z-index:1200;left:12px;right:12px;max-width:520px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:98px;align-items:center;gap:8px;
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px}
.navcard > button{flex:none;width:48px;height:48px;border:0;background:transparent;color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.navcard > button:active{background:var(--mintbg)}
.navmid{flex:1;min-width:0;text-align:center}
.navmid span{display:block;font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navmid span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.navmid div{display:flex;justify-content:center;align-items:baseline;gap:16px}
.navmid b{font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.navmid b small{font-size:17px;font-weight:700;margin-left:2px}
body.nav .navdetail.on{display:block}
.navdetail{position:fixed;z-index:1150;left:12px;right:12px;max-width:520px;bottom:calc(122px + env(safe-area-inset-bottom));background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.navdetail p{margin:2px 0;font-size:13px;color:var(--ink2)}
.navdetail p b{color:var(--navy)}
@media (min-width:821px){ .navtop,.navcard,.navdetail,.walkcard{left:50%;right:auto;width:520px;transform:translateX(-50%)} }
#tip{position:fixed;pointer-events:none;background:var(--navy2);color:#fff;padding:4px 9px;border-radius:6px;font-size:12px;display:none;z-index:4000;white-space:nowrap}
#toast{position:fixed;z-index:4500;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,190px) + 20px);background:rgba(20,58,82,.94);color:#fff;font-size:13px;border-radius:99px;padding:8px 16px;display:none;max-width:calc(100vw - 90px);text-align:center}
.maplibregl-ctrl-attrib{font-size:9px}
.maplibregl-ctrl-bottom-left{bottom:var(--sheet-h,190px)}
body.nav .maplibregl-ctrl-bottom-left{bottom:calc(116px + env(safe-area-inset-bottom))}
img.car{display:block;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(20,58,82,.35))}
#compass svg{transition:none}


@media (min-width:821px){
  .sheet{left:12px;right:auto;bottom:12px;width:400px;border-radius:20px;box-shadow:var(--shadow);max-height:calc(100vh - 230px)}

</style>
</head>
<body>

<div id="intro">
  <div class="intro-in">
    <h1>마채테 STEP 1-2</h1>
    <button id="start" type="button">내 위치에서 시작하기</button>
  </div>
</div>

<div id="map"></div>

<div class="top">
  <div class="search">
    <span class="logo" id="barIcon"></span>
    <input id="q" type="search" placeholder="충전소 이름·주소 검색" autocomplete="off">
    <button id="home" type="button">처음</button>
  </div>
  <div class="infrabar" id="infraBar">
    <button id="infraBack" type="button" aria-label="목록으로"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div><b id="infraTitle"></b><span id="infraSub"></span></div>
    <button id="infraClear" type="button" aria-label="전체 종류 보기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="chips" id="infraChips"></div>
  <div class="chips" id="chips">
    <button class="chip" data-f="fast" aria-pressed="false">급속</button>
    <button class="chip" data-f="slow" aria-pressed="false">완속만</button>
    <button class="chip" data-f="stay" aria-pressed="false"><i style="background:var(--accent)"></i>채비스테이</button>
    <button class="chip" data-f="free" aria-pressed="false"><i style="background:var(--q2)"></i>한가한 곳</button>
    <button class="chip" data-f="busy" aria-pressed="false"><i style="background:var(--q5)"></i>붐비는 곳</button>
  </div>
</div>

<div class="hourpill" aria-label="시각 선택">
  <button id="hUp" type="button" aria-label="한 시간 뒤">▲</button>
  <b id="hourLabel">19시</b><hr><span>이용률</span>
  <button id="hDown" type="button" aria-label="한 시간 앞">▼</button>
</div>

<div class="fabs">
  <button class="fab" id="legendBtn" type="button" aria-pressed="false">범례</button>
  <button class="fab" id="allBtn" type="button">전국</button>
  <button class="fab" id="compass" type="button" aria-label="북쪽을 위로"><svg viewBox="0 0 24 24"><path d="M12 2.5 L16 12 H8 Z" fill="#ff7a59"/><path d="M12 21.5 L8 12 H16 Z" fill="#c9d1d6"/></svg></button>
</div>
<div class="legendbox" id="legendbox">
  <b>표시 색 = 선택한 시각의 이용률</b>
  <div><i style="background:var(--q1)"></i>10% 미만</div>
  <div><i style="background:var(--q2)"></i>10~25%</div>
  <div><i style="background:var(--q3)"></i>25~50%</div>
  <div><i style="background:var(--q4)"></i>50~75%</div>
  <div><i style="background:var(--q5)"></i>75% 이상</div>
  <div><i style="background:var(--nodata)"></i>기록 없음</div>
  <div><i class="stay"></i>채비스테이</div>
  <div><img src="car.png" alt="" style="width:12px;height:19px;margin:0 0"> 내 위치</div>
</div>
<button class="fab" id="locate" type="button" aria-label="내 위치로" style="color:var(--mint2)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
</button>

<div class="navtop" id="navTop">
  <div class="navnote" id="navNote"><span class="noteic" id="noteIc"></span><div><b>길안내를 시작합니다.</b><span id="noteTxt"></span></div></div>
  <div class="navmain"><span class="navarrow" id="navArrow"></span><b id="navDist"></b><span id="navText"></span></div>
</div>
<div class="navfabs">
  <button class="fab" id="zin" type="button" aria-label="확대">＋</button>
  <button class="fab" id="zout" type="button" aria-label="축소">－</button>
  <button class="fab" id="overview" type="button">전체</button>
</div>
<button class="recenter" id="recenter" type="button"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 3 L3 10.5 L10.5 13.5 L13.5 21 Z" fill="currentColor"/></svg>내 위치로</button>
<div class="navdetail" id="navDetail"></div>
<button class="fab walkfab" id="walkOverview" type="button" aria-label="경로 전체 보기"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="5.5" r="2.5"/><path d="M4 19h9a3.5 3.5 0 0 0 0-7H8.5a3.5 3.5 0 0 1 0-7H12"/><circle cx="4" cy="19" r="1.2" fill="currentColor"/></svg></button>
<button class="fab walkfab" id="walkRe" type="button" aria-label="다시 계산"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
<div class="walkcard" id="walkCard">
  <i class="wgrip"></i>
  <div class="wrow">
    <div class="wmain">
      <div class="wline"><b id="wMin"></b><i></i><b id="wDist"></b><i></i><span id="wEta"></span></div>
      <div class="wbar"><div class="wfill" id="wFill"></div><span class="wdot" id="wDot"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></span></div>
    </div>
    <button id="walkMenu" type="button" aria-label="자세히"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</div>
<div class="navcard" id="navCard">
  <button id="navRe" type="button" aria-label="다시 계산"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14 5.3"/><path d="M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4"/><path d="M6 21v-4h4"/></svg></button>
  <div class="navmid"><span id="navName"></span><div><b id="navEta"></b><b id="navRem"></b></div></div>
  <button id="navMenu" type="button" aria-label="자세히"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div class="placecard" id="placeCard">
  <span class="pin" id="pcPin"></span>
  <div class="pcmid"><b id="pcName"></b><span id="pcSub"></span></div>
  <button class="pcgo" id="pcGo" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="13.5" cy="4" r="2.2"/><path d="M12.2 7.2l-3.6 1.6-1.4 4 1.9.7 1-3 1.3-.5-1.2 5.6-3.4 5.2 1.8 1.2 3.7-5.6.6-2.3 2 2.4.6 5.3h2.2l-.7-6.2-2.3-3 .6-2.7 1 1.5 3 1 .6-2-2.3-.8-1.7-2.8a2.3 2.3 0 0 0-3.7-.6z"/></svg>도보 안내</button>
  <button class="pcx" id="pcX" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<button class="listbtn" id="listBtn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17" r="1" fill="currentColor"/></svg><span id="listBtnTxt">목록 보기</span></button>
<section class="sheet" id="sheet">
  <button class="handle" id="handle" type="button" aria-label="서랍 펼치기·접기"></button>
  <div class="tabs" role="tablist">
    <button id="tabNear" role="tab" aria-selected="true" type="button">주변 충전소</button>
    <button id="tabAll" role="tab" aria-selected="false" type="button">전국 추세</button>
  </div>
  <div class="body" id="body"></div>
</section>
<div id="tip"></div><div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const C = {id:0,name:1,addr:2,lat:3,lng:4,sido:5,kind:6,n:7,nfast:8,kw:9,apt:10,stay:11,occ:12,med:13,ses:14,bad:15,poi:16};
const POI_COL = ['#eb6834','#6250d6','#eda100','#e87ba4','#2a78d6','#008300','#1baf7a'];   // 식사·카페·테이크아웃·쇼핑·편의·관광여가·업무
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const RAMP = ['--nodata','--q1','--q2','--q3','--q4','--q5'].map(css);
const bin = v => v < 0 ? 0 : v < 10 ? 1 : v < 25 ? 2 : v < 50 ? 3 : v < 75 ? 4 : 5;
const occTxt = v => v < 0 ? '기록 없음' : v + '%';
const wide = () => innerWidth > 820;

/* 주변 인프라 종류 아이콘 (직접 그린 단순한 모양, 24x24, 색은 currentColor) */
const PICON = [
  '<rect x="5.6" y="10" width="2" height="11" rx="1"/><ellipse cx="6.6" cy="7" rx="3" ry="4.2"/><path d="M14 3h1.4v5h1.1V3h1.4v5H19V3h1.4v6.2a2.2 2.2 0 0 1-2.2 2.2V20a1 1 0 0 1-2 0v-8.6A2.2 2.2 0 0 1 14 9.2z"/>',
  '<path d="M4 6.5h12.5V13a5.5 5.5 0 0 1-5.5 5.5H9.5A5.5 5.5 0 0 1 4 13z"/><path d="M16.5 8h1.7a3.3 3.3 0 0 1 0 6.6h-1.7v-1.9h1.7a1.4 1.4 0 0 0 0-2.8h-1.7z"/><rect x="4" y="19.6" width="12.5" height="1.7" rx=".85"/>',
  '<path d="M3.5 10.2a8.5 6.4 0 0 1 17 0z"/><rect x="3" y="11.6" width="18" height="3" rx="1.5"/><path d="M3.8 16h16.4v1.2a3.2 3.2 0 0 1-3.2 3.2H7a3.2 3.2 0 0 1-3.2-3.2z"/>',
  '<path d="M4.6 8.2h14.8l-1 11.6a1.7 1.7 0 0 1-1.7 1.5H7.3a1.7 1.7 0 0 1-1.7-1.5z"/><path d="M8.6 8.4V6.6a3.4 3.4 0 0 1 6.8 0v1.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  '<path d="M2.6 10h18.8l-1.7 9.3a1.7 1.7 0 0 1-1.7 1.4H6a1.7 1.7 0 0 1-1.7-1.4z"/><path d="M7.4 10.2L12 4l4.6 6.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>',
  '<path d="M2.6 6.6h18.8v3.6a1.8 1.8 0 0 0 0 3.6v3.6H2.6v-3.6a1.8 1.8 0 0 0 0-3.6z"/>',
  '<rect x="4.6" y="4.8" width="14.8" height="10.6" rx="1.7"/><path d="M2 17h20v.9a1.9 1.9 0 0 1-1.9 1.9H3.9A1.9 1.9 0 0 1 2 17.9z"/>'];
const picon = (i, size) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor">${PICON[i]}</svg>`;
const pinSVG = i => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96"><circle cx="24" cy="24" r="21" fill="${POI_COL[i]}" stroke="#fff" stroke-width="3"/><g transform="translate(11 11) scale(1.083)" fill="#fff" color="#fff">${PICON[i].replace(/currentColor/g, '#fff')}</g></svg>`;
/* 표시 = 동그라미(이용률 색) + 번개 모양 */
const VPATH = 'M13.6 2 L5 13.4 H10.9 L9.6 22 L19 9.6 H12.6 Z';
const markSVG = (body, halo, dark) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96">
<circle cx="24" cy="24" r="${halo ? 19 : 21}" fill="${body}" stroke="${halo ? '#ff7a59' : '#17303f'}" stroke-width="${halo ? 6 : 2.5}"/>
<path transform="translate(9.6 9.2) scale(1.2)" d="${VPATH}" fill="${dark ? '#17303f' : '#fff'}"/></svg>`;
const logoSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="${VPATH}" fill="#2ccdbf"/></svg>`;
$('#barIcon').innerHTML = logoSVG;
const sprites = {};
const loadPins = () => Promise.all(PICON.map((_, i) => new Promise(res => { const im = new Image(96, 96); im.onload = res; im.onerror = res;
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pinSVG(i)); sprites['p' + i] = im; })));
const loadChev = () => new Promise(res => { const im = new Image(48, 48); im.onload = res; im.onerror = res;      // 경로선 위 진행 방향 표시
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48"><path d="M7 4 L20 12 L7 20 L10.5 12 Z" fill="#143a52"/></svg>'); sprites.chev = im; });
const loadSprites = () => Promise.all([loadPins(), loadChev()].concat([0,1].flatMap(st => RAMP.map((col, i) => new Promise(res => {
  const im = new Image(96, 96); im.onload = res; im.onerror = res;
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markSVG(col, !!st, i < 4));
  sprites['m' + st + '_' + i] = im; })))));

const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.display = 'block';
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY - 34) + 'px'; }
const hideTip = () => tip.style.display = 'none';
let toastT; function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 4000); }

let sortBy = 'near';
let D, shown = [], selected = null, hour = new Date().getHours(), tab = 'near';
let me = null, meMarker = null, heading = null, follow = false, ready = false;
const F = {fast:false, slow:false, stay:false, free:false, busy:false};
const SEOUL = [37.5665, 126.978];
const EMPTY = {type:'FeatureCollection', features:[]};

/* 지도: OSM 바탕. 확대·회전·기울이기가 끊김 없이 이어짐 */
const map = new maplibregl.Map({container:'map', center:[SEOUL[1], SEOUL[0]], zoom:11.5, minZoom:5, maxZoom:19, maxPitch:60, attributionControl:false,
  style:{version:8, sources:{osm:{type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, maxzoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자'}},
    layers:[{id:'bg', type:'background', paint:{'background-color':'#f1e9dc'}},
      {id:'osm', type:'raster', source:'osm', paint:{'raster-saturation':-0.15, 'raster-contrast':-0.06, 'raster-brightness-max':1}},
      {id:'warm', type:'background', paint:{'background-color':'#f0c078', 'background-opacity':0.13}}]}});
map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-left');
map.touchZoomRotate.enableRotation(); map.dragRotate.enable(); map.keyboard.enable();
const zoomSize = (z, lo, hi) => lo + (hi - lo) * Math.max(0, Math.min(1, (z - 7) / 9));
const sizeExpr = (lo, hi) => ['interpolate', ['linear'], ['zoom'], 7, ['*', ['get', 'k'], lo / 48], 16, ['*', ['get', 'k'], hi / 48]];
const mapLoaded = new Promise(res => map.on('load', () => {
  Object.entries(sprites).forEach(([k, im]) => map.addImage(k, im, {pixelRatio:2}));
  ['route','conn','acc','ring','poi','sel','st','stay'].forEach(id => map.addSource(id, {type:'geojson', data:EMPTY}));
  map.addLayer({id:'acc', type:'fill', source:'acc', paint:{'fill-color':'#58ddd0', 'fill-opacity':0.18, 'fill-outline-color':'#17a99a'}});
  map.addLayer({id:'route-case', type:'line', source:'route', layout:{'line-cap':'round', 'line-join':'round'}, paint:{'line-color':'#143a52', 'line-width':['interpolate',['linear'],['zoom'],8,6,16,14,18,17]}});
  map.addLayer({id:'route-line', type:'line', source:'route', layout:{'line-cap':'round', 'line-join':'round'}, paint:{'line-color':'#58ddd0', 'line-width':['interpolate',['linear'],['zoom'],8,3,16,9,18,12]}});
  map.addLayer({id:'conn', type:'line', source:'conn', layout:{'line-cap':'round'}, paint:{'line-color':'#8d99a3', 'line-width':5, 'line-dasharray':[0.1, 2.2]}});
  map.addLayer({id:'route-arrows', type:'symbol', source:'route', layout:{'symbol-placement':'line', 'symbol-spacing':['interpolate',['linear'],['zoom'],12,34,18,56],
    'icon-image':'chev', 'icon-size':['interpolate',['linear'],['zoom'],12,0.4,16,0.62,18,0.8], 'icon-allow-overlap':true, 'icon-ignore-placement':true, 'icon-rotation-alignment':'map'}});
  map.addLayer({id:'ring-fill', type:'fill', source:'ring', paint:{'fill-color':'#1b4965', 'fill-opacity':0.05}});
  map.addLayer({id:'ring', type:'line', source:'ring', paint:{'line-color':'#1b4965', 'line-width':1.5, 'line-dasharray':[3, 3]}});
  map.addLayer({id:'poi', type:'symbol', source:'poi', layout:{'icon-image':['concat', 'p', ['to-string', ['get', 'c']]],
    'icon-size':['interpolate',['linear'],['zoom'],13,0.2,15.5,0.42,18,0.62], 'icon-allow-overlap':true, 'icon-ignore-placement':true}});
  map.addLayer({id:'sel', type:'circle', source:'sel', paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,['*',['get','k'],9],16,['*',['get','k'],26]],
    'circle-color':'rgba(88,221,208,.45)', 'circle-stroke-color':'#1b4965', 'circle-stroke-width':2, 'circle-pitch-alignment':'map'}});
  const sym = {'icon-image':['get','img'], 'icon-size':sizeExpr(9, 30), 'icon-allow-overlap':true, 'icon-ignore-placement':true};
  map.addLayer({id:'st', type:'symbol', source:'st', layout:sym});
  map.addLayer({id:'stay', type:'symbol', source:'stay', layout:sym});
  res();
}));
function updateMap(){
  if (!ready) return;
  const f = s => ({type:'Feature', geometry:{type:'Point', coordinates:[s[C.lng], s[C.lat]]},
    properties:{id:s[C.id], img:'m' + s[C.stay] + '_' + bin(s[C.occ][hour]), k:s[C.stay] ? 1.7 : 1}});
  map.getSource('st').setData({type:'FeatureCollection', features:shown.filter(s => !s[C.stay]).map(f)});
  map.getSource('stay').setData({type:'FeatureCollection', features:shown.filter(s => s[C.stay]).map(f)});
  map.getSource('sel').setData(selected ? {type:'FeatureCollection', features:[f(selected)]} : EMPTY);
  if (!selected || route) clearPoi(); else if (poi.s === selected) drawPoi();
  if (route && route.mode === 'walk'){ const d = route.dest;       // 도보 안내 중에는 목적지 핀 하나만 남김
    map.getSource('poi').setData({type:'FeatureCollection', features:[{type:'Feature', geometry:{type:'Point', coordinates:[d.lng, d.lat]}, properties:{n:d.name, c:d.c, s:d.sub, d:d.d}}]}); }

}
const draw = updateMap;
const byId = id => D.stations.find(x => x[C.id] === id);
function hit(pt){ const fs = map.queryRenderedFeatures([[pt.x - 6, pt.y - 6], [pt.x + 6, pt.y + 6]], {layers:['stay','st']}); return fs.length ? byId(fs[0].properties.id) : null; }
map.on('click', e => { if (!ready || route) return; const s = hit(e.point); if (s){ select(s, false); return; }
  const f = map.queryRenderedFeatures([[e.point.x - 9, e.point.y - 9], [e.point.x + 9, e.point.y + 9]], {layers:['poi']})[0];
  if (f) showPlace(f.properties.n, f.properties.c, f.properties.s, f.properties.d, f.geometry.coordinates); else hidePlace(); });
let placePop = null;
let place = null;
function hidePlace(){ place = null; if (placePop) placePop.remove(); document.body.classList.remove('placeon'); }
function showPlace(n, c, s, d, lngLat){        // 가게를 고르면: 지도에 이름 말풍선 + 아래에 '도보 안내' 단추가 있는 카드
  if (placePop) placePop.remove();

}
function loadPoi(s){
  if (!D.meta.poi){ poi = {s, data:null, cat:-1, state:'none'}; return; }
  if (poi.s === s) return;
  poi = {s, data:null, cat:-1, state:s[C.poi] ? 'loading' : 'uncovered'};
  drawPoi();
  if (!s[C.poi]) return;
  const R = D.meta.poi.radius, kx = Math.cos(s[C.lat] * Math.PI / 180) * 111320;      // 반경 원이 화면에 들어오도록 맞춤
  fit([[s[C.lat] + R / 110540, s[C.lng] - R / kx], [s[C.lat] - R / 110540, s[C.lng] + R / kx]], 16.5);
  fetch('data/poi/' + s[C.id] + '.json').then(r => r.json()).then(d => { if (poi.s !== s) return; poi.data = d; poi.state = 'ok'; drawPoi(); renderPoi(); })
    .catch(() => { if (poi.s === s){ poi.state = 'error'; renderPoi(); } });
}
function renderPoi(){
  const m = D.meta.poi, on = !!selected && poi.s === selected && poi.state === 'ok';
  document.body.classList.toggle('infra', on && !route);
  if (on){      // 위쪽 띠와 종류 단추
    const d = poi.data, sum = d.n.reduce((a, b) => a + b, 0);
    $('#infraTitle').textContent = selected[C.name];
    $('#infraSub').textContent = `주변 ${m.radius}m · ${poi.cat < 0 ? '전체 ' + sum.toLocaleString('ko-KR') + '곳' : m.cats[poi.cat] + ' ' + d.n[poi.cat] + '곳'}`;
    $('#infraClear').style.visibility = poi.cat < 0 ? 'hidden' : 'visible';
    $('#infraChips').innerHTML = m.cats.map((c, i) => `<button class="chip" type="button" data-c="${i}" aria-pressed="${poi.cat === i}"><span class="ic" style="color:${POI_COL[i]}">${picon(i, 18)}</span>${c} <b>${d.n[i]}</b></button>`).join('');
    $('#infraChips').querySelectorAll('.chip').forEach(b => b.onclick = () => { const c = +b.dataset.c; poi.cat = poi.cat === c ? -1 : c; hidePlace(); drawPoi(); renderPoi(); });
    $('#listBtnTxt').textContent = sheetH > baseH() ? '지도 보기' : '목록 보기';
  }
  const el = $('#poiBox'); if (!el || !selected || poi.s !== selected) return;
  if (poi.state === 'none'){ el.innerHTML = ''; return; }
  if (poi.state === 'uncovered'){ el.innerHTML = `<h4>주변 인프라</h4><p>${selected[C.sido]}은(는) 상권 자료가 아직 없음 (현재 ${m.covered.length}개 시·도만 있음)</p>`; return; }
  if (poi.state === 'loading'){ el.innerHTML = `<h4>주변 인프라 (반경 ${m.radius}m)</h4><p>불러오는 중…</p>`; return; }
  if (poi.state === 'error'){ el.innerHTML = `<h4>주변 인프라</h4><p>상권 자료를 불러오지 못함</p>`; return; }
  const d = poi.data, list = d.p.filter(x => poi.cat < 0 || x[1] === poi.cat).slice(0, 60), sum = d.n.reduce((a, b) => a + b, 0);
  el.innerHTML = `<h4>주변 인프라 · ${poi.cat < 0 ? '전체' : m.cats[poi.cat]} (가까운 순 ${list.length}곳)</h4>
    ${sum > d.p.length ? `<p class="hint">가게가 많아 지도와 목록에는 가까운 ${d.p.length}곳까지만 나옴</p>` : ''}` +
    (list.map((x, k) => `<div class="prow" data-k="${k}"><span class="pin" style="background:${POI_COL[x[1]]}">${picon(x[1], 17)}</span><div class="nm"><b>${x[0]}</b><span>${x[2]}</span></div><div class="oc"><b>${x[5]}m</b></div></div>`).join('') || '<p class="hint">해당하는 곳 없음</p>');
  el.querySelectorAll('.prow').forEach(r => r.onclick = () => { const x = list[+r.dataset.k]; setSheet(false); renderPoi();
    map.easeTo({center:[x[4], x[3]], zoom:Math.max(map.getZoom(), 17), duration:500}); showPlace(x[0], x[1], x[2], x[5], [x[4], x[3]]); });
}
$('#infraBack').onclick = () => { selected = null; renderBody(); updateMap(); };
$('#infraClear').onclick = () => { poi.cat = -1; hidePlace(); drawPoi(); renderPoi(); };
$('#listBtn').onclick = () => { setSheet(!(sheetH > baseH())); renderPoi(); };

function passes(s){
  const q = $('#q').value.trim(), o = s[C.occ][hour];
  if (F.fast && s[C.nfast] === 0) return false;
  if (F.slow && s[C.nfast] > 0) return false;
  if (F.stay && !s[C.stay]) return false;
  if (F.free && !(o >= 0 && o < 25)) return false;
  if (F.busy && !(o >= 50)) return false;
  if (q && !(s[C.name].includes(q) || s[C.addr].includes(q))) return false;
  return true;
}
function refresh(){ if (!D) return; $('#hourLabel').textContent = hour + '시'; shown = D.stations.filter(passes); updateMap(); renderBody(); }

const km = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
const kmTxt = d => d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(d < 10 ? 1 : 0) + 'km';

function select(s, pan){ selected = s; if (pan && !s[C.poi]) flyTo(s[C.lat], s[C.lng], 15); if (!route) setSheet(!s[C.poi]); renderBody(); updateMap(); if (!route) loadPoi(s); renderPoi(); }

function renderBody(){
  const el = $('#body');
  if (route) return renderNav();
  if (selected) return renderDetail(el);
  if (tab === 'all') return renderAll(el);
  const c = map.getCenter(), ref = [c.lat, c.lng];
  const list = shown.map(s => [km(ref, [s[C.lat], s[C.lng]]), s]).sort((a, b) => a[0] - b[0]).slice(0, 30);
  // 이용률 낮은 순: 가까운 30곳 안에서 다시 줄 세움 (기록 없는 곳은 맨 뒤, 같으면 가까운 순)
  if (sortBy === 'occ') list.sort((a, b) => { const x = a[1][C.occ][hour], y = b[1][C.occ][hour];
    return (x < 0) - (y < 0) || x - y || a[0] - b[0]; });
  el.innerHTML = `<div class="sort" role="group" aria-label="정렬 기준">
      <button type="button" data-s="near" aria-pressed="${sortBy === 'near'}">가까운 순</button>
      <button type="button" data-s="occ" aria-pressed="${sortBy === 'occ'}">이용률 낮은 순</button></div>
    <p class="hint">${sortBy === 'near' ? '지도 가운데에서 가까운 30곳' : '지도 가운데에서 가까운 30곳 안에서 이용률 낮은 순'} · ${hour}시 이용률 (${D.meta.days_by_hour[hour]}일치 평균) · 조건에 맞는 ${shown.length.toLocaleString('ko-KR')}곳</p>` +
    (list.map(([d, s]) => `<div class="row" data-id="${s[C.id]}"><span class="dot" style="background:${RAMP[bin(s[C.occ][hour])]}"></span>
      <div class="nm"><b>${s[C.name]}${s[C.stay] ? ' <span class="badge">스테이</span>' : ''}</b><span>${kmTxt(d)} · 충전기 ${s[C.n]}대(급속 ${s[C.nfast]}) · 최대 ${s[C.kw]}kW</span></div>
      <div class="oc"><b>${occTxt(s[C.occ][hour])}</b><span>이용률</span></div></div>`).join('') || '<p class="hint">조건에 맞는 충전소 없음</p>');
  el.querySelectorAll('.sort button').forEach(b => b.onclick = () => { sortBy = b.dataset.s; renderBody(); });
  el.querySelectorAll('.row').forEach(r => r.onclick = () => select(D.stations.find(x => x[C.id] === r.dataset.id), true));
  el.scrollTop = 0;
}

const ARROW = {
  right:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 42V25a9 9 0 0 1 9-9h15"/><path d="M27 6l10 10-10 10"/></svg>',
  left:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M36 42V25a9 9 0 0 0-9-9H12"/><path d="M21 6L11 16l10 10"/></svg>',
  straight:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 42V9"/><path d="M12 19L24 7l12 12"/></svg>',
  uturn:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M34 42V20a10 10 0 0 0-20 0v14"/><path d="M5 26l9 9 9-9"/></svg>',
  dest:'<svg viewBox="0 0 48 48" fill="currentColor"><path d="M24 4a15 15 0 0 0-15 15c0 11 15 25 15 25s15-14 15-25A15 15 0 0 0 24 4zm0 21a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg>'};
const arrowFor = t => /유턴/.test(t) ? ARROW.uturn : /우회전|오른쪽/.test(t) ? ARROW.right : /좌회전|왼쪽/.test(t) ? ARROW.left : /목적지|도착/.test(t) ? ARROW.dest : ARROW.straight;
const mTxt = d => d >= 1000 ? (d / 1000).toFixed(1) + 'km' : d >= 100 ? Math.round(d / 10) * 10 + 'm' : Math.max(0, Math.round(d)) + 'm';
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function renderNav(){
  if (!route) return; const walk = route.mode === 'walk';
  $('#navName').textContent = (walk ? '도보 · ' : '') + route.dest.name;
  if (!route.path){
    $('#navArrow').innerHTML = ARROW.straight; $('#navDist').textContent = ''; $('#navText').textContent = route.err || '경로 계산 중…';
    $('#navEta').textContent = '--:--'; $('#navRem').textContent = ''; $('#navDetail').innerHTML = detailHTML(); bindDetail();
    $('#wMin').textContent = '--'; $('#wDist').textContent = ''; $('#wEta').textContent = route.err || '경로 계산 중…'; return;
  }
  const g = route.guides, last = route.gi >= g.length - 1, cur = g[Math.min(route.gi, g.length - 1)];
  const d = last || !cur ? route.rem : Math.max(0, cur.s - (route.pos || 0));      // 다음 안내 지점까지 경로를 따라 남은 거리
  const text = last || !cur ? '목적지' : (cur.text || '직진');
  $('#navArrow').innerHTML = arrowFor(text); $('#navDist').textContent = mTxt(d); $('#navText').textContent = text;
  const eta = new Date(route.at.getTime() + route.dur * 1000), rem = route.rem / 1000;
  $('#navEta').textContent = hm(eta);
  $('#navRem').innerHTML = (rem < 1 ? Math.round(rem * 1000) + '<small>m</small>' : rem.toFixed(1) + '<small>km</small>');
  $('#navDetail').innerHTML = detailHTML(); bindDetail();
  if (walk){      // 도보: 남은 시간 | 남은 거리 | 도착 시각 + 진행 막대
    const frac = Math.max(0, Math.min(1, 1 - route.rem / (route.dist || 1))), left = route.dur * (1 - frac), mins = Math.max(1, Math.round(left / 60));
    $('#wMin').innerHTML = mins >= 60 ? `${Math.floor(mins / 60)}<small>시간</small> ${mins % 60}<small>분</small>` : `${mins}<small>분</small>`;
    $('#wDist').innerHTML = rem < 1 ? Math.round(rem * 1000) + '<small>m</small>' : rem.toFixed(1) + '<small>km</small>';
    $('#wEta').textContent = hm(new Date(Date.now() + left * 1000)) + ' 도착';
    $('#wFill').style.width = frac * 100 + '%'; $('#wDot').style.left = frac * 100 + '%';
  }
}
function detailHTML(){
  const d = route.dest, walk = route.mode === 'walk'; let info = `<p>${route.err || '경로 계산 중…'}</p>`;
  if (route.path){ const eta = new Date(route.at.getTime() + route.dur * 1000), mins = Math.max(1, Math.round(route.dur / 60));
    info = walk
      ? `<p>도보 <b>${mins}분</b> · <b>${mTxt(route.dist)}</b> · ${route.track ? '내 위치에서 출발' : route.s[C.name] + '에서 출발'}</p>
         <p>걷는 길 기준이며 실제 횡단보도·건물 출입구와 다를 수 있음${route.track ? ' · 경로에서 30m 넘게 벗어나면 다시 계산함' : ''}</p>`
      : `<p>예상 시간 <b>${mins}분</b> (마지막 계산 시점 기준) · 도착 시각(${eta.getHours()}시)의 이용률 <b>${occTxt(route.s[C.occ][eta.getHours()])}</b></p>
         <p>마지막 계산 ${hm(route.at)}:${String(route.at.getSeconds()).padStart(2,'0')} · ${route.why} · 계산 ${route.n}회${route.busy ? ' · 다시 계산 중…' : ''}${route.err ? ' · ' + route.err : ''}</p>

  return `<p>${d.sub || ''}</p>${info}<div class="acts" style="margin-bottom:0">
    <a class="act" href="https://map.kakao.com/link/to/${encodeURIComponent(d.name)},${d.lat},${d.lng}" target="_blank" rel="noopener">카카오맵으로 길안내</a>
    <button class="act ghost" id="stopRoute" type="button">안내 끝</button></div>`;
}

function renderDetail(el){

  const y = v => T + (H - T - B) * (1 - v / 100);
  let bars = '';
  for (let h = 0; h < 24; h++){
    const v = o[h], x = L0 + h * bw + 1;
    if (v >= 0){ const top = y(v), ht = H - B - top, r = Math.min(3, ht);
      bars += `<path d="M${x},${H-B} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - 2 - r} Q${x + bw - 2},${top} ${x + bw - 2},${top + r} V${H-B} Z" fill="${h === hour ? 'var(--s1)' : 'var(--q3)'}"/>`; }
    bars += `<rect x="${L0 + h * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-t="${h}시 · ${occTxt(v)}"/>`;
  }
  const grid = [0,50,100].map(v => `<line x1="${L0}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L0 - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const xl = [0,6,12,18,23].map(h => `<text x="${L0 + h * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${h}시</text>`).join('');
  const dist = me ? ` · 내 위치에서 ${kmTxt(km(me, [s[C.lat], s[C.lng]]))}` : '';
  el.innerHTML = `<div class="det"><button class="back" id="back" type="button">← 목록</button>
    <h3>${s[C.name]}${s[C.stay] ? ' <span class="badge">채비스테이</span>' : ''}</h3>
    <p>${s[C.addr]}</p><p>${s[C.kind]}${dist}</p>
    <div class="facts"><div><b>${occTxt(o[hour])}</b>${hour}시 이용률</div><div><b>${s[C.n]}대</b>충전기 (급속 ${s[C.nfast]})</div>
    <div><b>${s[C.med] < 0 ? '-' : s[C.med] + '분'}</b>급속 1회 중앙값</div></div>
    <div class="acts"><button class="act" id="goRoute" type="button">여기까지 경로 안내</button></div>
    <div id="poiBox"></div>
    <h4>시간대별 이용률 (%) · 남색 막대 = ${hour}시</h4>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="시간대별 이용률 막대 그래프">${grid}${bars}${xl}</svg>
    <p>최대 출력 ${s[C.kw]}kW${s[C.bad] > 0 ? ' · 통신이상 ' + s[C.bad] + '%' : ''}</p></div>`;
  renderPoi();
  $('#back').onclick = () => { selected = null; renderBody(); draw(); };
  $('#goRoute').onclick = () => startRoute(s);
  el.querySelectorAll('rect[data-t]').forEach(r => { r.onmousemove = e => showTip(e, r.dataset.t); r.onmouseleave = hideTip; });
  el.scrollTop = 0;
}

    <h4>${hour}시 이용률 높은 곳 (충전기 2대 이상)</h4>` +

      <div class="nm"><b>${s[C.name]}</b><span>${s[C.sido]} · 충전기 ${s[C.n]}대</span></div><div class="oc"><b>${s[C.occ][hour]}%</b><span>이용률</span></div></div>`).join('') +
    `<h4>읽을 때 주의</h4><ul class="limits">${[
      `범위는 전국이고 아파트 충전소는 뺌. 수집 기간이 ${m.first.slice(0,10)} ~ ${m.last.slice(0,10)}(${m.n_polls}회)로 짧고 중간에 끊긴 구간이 있음. 시각마다 겹친 날 수가 1~3일이라 요일 차이는 볼 수 없음`,
      'DArt-B 8기 학술제 마채테 팀의 예비 대시보드이며 채비(CHAEVI)의 공식 서비스가 아님. 위치는 저장하지 않으며, 경로 안내를 누를 때만 출발·도착 좌표가 길찾기 서버(카카오)로 전송됨',
      '지금 이 순간의 상태가 아니라 수집 기간의 같은 시각 평균임',
      '이용률 = 충전중 대수 ÷ (충전대기 + 충전중) 대수. 통신이상·상태미확인 충전기는 계산에서 뺌',
      '바뀐 것만 담긴 기록(delta)은 직전 상태를 그대로 이어 붙여 계산함. 끊긴 구간 직후 값은 실제와 다를 수 있음',
      `충전 1회 시간 중앙값: 급속 ${m.med_fast_min}분, 완속 ${m.med_slow_min}분 (충전 ${f(m.n_sessions)}회 기준, 1분 미만·24시간 초과 제외)`
    ].map(t => `<li>${t}</li>`).join('')}</ul>`;
  el.querySelectorAll('.row').forEach(r => r.onclick = () => select(D.stations.find(x => x[C.id] === r.dataset.id), true));
  const hitR = $('#hit'), cross = $('#cross');
  hitR.onmousemove = e => { const b = hitR.getBoundingClientRect(), h = Math.max(0, Math.min(23, Math.round((e.clientX - b.left) / b.width * 23)));
    cross.setAttribute('x1', x(h)); cross.setAttribute('x2', x(h)); cross.style.display = '';
    showTip(e, `${h}시 · 급속 ${n.fast[h]}% · 완속 ${n.slow[h]}%`); };
  hitR.onmouseleave = () => { cross.style.display = 'none'; hideTip(); };
  el.scrollTop = 0;
}
</script>
</body>
</html>
