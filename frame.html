<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e2d6">
<title>충전소 지도 (STEP 1-2 예비)</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* 넓은 화면에서 휴대폰 비율로 보여 주는 틀 */
html,body{height:100%;margin:0}
body{background:#e9e2d6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.phone{width:412px;height:min(892px, calc(100vh - 40px));border-radius:30px;overflow:hidden;background:#fffdf8;
  box-shadow:0 24px 60px rgba(74,52,28,.28), 0 0 0 1px rgba(74,52,28,.14)}
.phone iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:820px){ .phone{width:100%;height:100%;border-radius:0;box-shadow:none} }
</style>
</head>
<body>
<div class="phone"><iframe id="app" title="충전소 지도" allow="geolocation; accelerometer; gyroscope; magnetometer"></iframe></div>
<script>document.getElementById('app').src = 'index.html' + location.hash;</script>
</body>
</html>
